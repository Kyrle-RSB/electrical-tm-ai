# Public-source development CI only. UNSIGNED artifacts; never a public product release.
name: Windows x64 packaged foundation verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fork-b-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-verification:
    runs-on: windows-2025
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
      - name: Execute complete native evidence collector
        run: node scripts/capture-native-proof.mjs --execute
      - name: Upload redacted native proof, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fork-b-windows-x64-evidence
          path: .local-evidence/native-*/
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
      - name: Upload UNSIGNED candidate package (not a release)
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: UNSIGNED-DO-NOT-DISTRIBUTE-windows-x64
          path: apps/desktop/out/make/
          if-no-files-found: error
          retention-days: 3
