name: Fork B source and financial tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  source-tests:
    name: Node tests and source integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.21.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm proof:typecheck
      - run: pnpm desktop:typecheck
      - run: pnpm test
      - run: node scripts/audit-repo-structure.mjs
      - run: node scripts/run-packaged-smoke.mjs --self-test
      - run: node scripts/audit-source-secrets.mjs
      - run: node scripts/verify-licenses.mjs
      - run: node scripts/audit-requirements.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: failed-source-logs
          path: dist-probe/
          retention-days: 2
