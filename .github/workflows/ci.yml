name: Phase 2 lint dependency lock preflight
on:
  push:
    branches: [work/phase2-lint-lock-preflight-20261124]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 12.21.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
      - name: Resolve exact candidate dependencies without executing dependency scripts
        run: |
          npm view eslint@9.39.1 version license engines dist.integrity --json
          npm view @typescript-eslint/parser@8.48.1 version license engines peerDependencies dist.integrity --json
          pnpm add --workspace-root --save-dev --save-exact --lockfile-only --ignore-scripts eslint@9.39.1 @typescript-eslint/parser@8.48.1
          git diff --stat
          mkdir -p /tmp/lint-lock-review
          cp package.json pnpm-lock.yaml /tmp/lint-lock-review/
          git diff -- package.json pnpm-lock.yaml > /tmp/lint-lock-review/lock.diff
          sha256sum /tmp/lint-lock-review/package.json /tmp/lint-lock-review/pnpm-lock.yaml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lint-lock-review
          path: /tmp/lint-lock-review/
          if-no-files-found: error
          retention-days: 3
