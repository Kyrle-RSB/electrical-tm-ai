name: Fork B source and financial tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  source-tests:
    name: Node tests and source integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.21.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: node scripts/audit-requirements.mjs --bootstrap
      - run: pnpm install --frozen-lockfile
      - run: pnpm proof:typecheck
      - run: pnpm desktop:typecheck
      - run: pnpm test
      - run: pnpm lint
      - run: node scripts/audit-requirements.mjs --self-test --toolchain-negative --bootstrap
      - run: node scripts/audit-repo-structure.mjs --self-test
      - run: node scripts/capture-native-proof.mjs --git-provenance-self-test
      - run: node scripts/run-packaged-smoke.mjs --self-test
      - run: node scripts/audit-native-proof.mjs --self-test
      - run: node scripts/audit-source-secrets.mjs --self-test
      - run: node scripts/verify-licenses.mjs --self-test
      - run: node scripts/audit-requirements.mjs
      - name: Preserve verified tracked source tree (not a binary or acceptance receipt)
        run: |
          git diff --exit-code HEAD --
          git rev-parse HEAD 'HEAD^{tree}'
          git archive --format=zip --output="$RUNNER_TEMP/fork-b-source.zip" HEAD
          sha256sum "$RUNNER_TEMP/fork-b-source.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fork-b-source-tree
          path: ${{ runner.temp }}/fork-b-source.zip
          if-no-files-found: error
          retention-days: 7
      - name: Admit source failure evidence only after known-signature screening
        id: failure-evidence-admission
        if: failure()
        run: node scripts/audit-source-secrets.mjs --source-failure-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure() && steps.failure-evidence-admission.outcome == 'success'
        with:
          name: failed-source-logs
          path: dist-probe/
          retention-days: 2
