name: Fork B source and financial tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  source-tests:
    name: Node tests and source integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm proof:typecheck
      - run: pnpm desktop:typecheck
      - run: pnpm test
      - run: node scripts/audit-repo-structure.mjs
      - run: node scripts/run-packaged-smoke.mjs --self-test
      - run: node scripts/audit-source-secrets.mjs
      - run: node scripts/verify-licenses.mjs
      - run: node scripts/audit-requirements.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failed-source-logs
          path: dist-probe/
          retention-days: 2
